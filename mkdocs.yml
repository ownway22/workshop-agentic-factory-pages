site_name: 晶圓製造工廠的 Agentic Factory
site_description: 使用 Microsoft Foundry、Microsoft Agent Framework 與 Aspire，觀察從設備異常到維護準備的五步 Agent workflow。
site_url: https://ownway22.github.io/workshop-agentic-factory-pages/
docs_dir: docs
site_dir: site
not_in_nav: |
  /troubleshooting.md
  /resources.md
dev_addr: 127.0.0.1:2800
use_directory_urls: true
copyright: >-
  教材版：standard-1（草稿） · 更新：2026-11-16 · GitHub Pages 教材版<br>
  文件與網站互動已驗證；雲端 lab 待講師驗證。原始素材 © Microsoft（MIT），詳見「授權」。

extra:
  generator: false

theme:
  name: material
  language: zh-TW
  font: false
  logo: assets/images/factory.png
  favicon: assets/images/factory.png
  palette:
    - scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切換深色模式
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切換淺色模式
  features:
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.integrate

plugins:
  - search:
      lang:
        - zh
        - en
      # 保留完整術語，避免英文 stemming 破壞前綴搜尋。
      pipeline: []
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
      draggable: true
      auto_caption: false
      skip_classes:
        - factory-logo

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      title: 本頁目錄
      toc_depth: 2
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/accessibility.js

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - 導覽: index.md
  - 準備: prerequisites.md
  - Task 1：啟動 Aspire: tasks/task-1-start-aspire.md
  - Task 2：確認 Workflow API 連線: tasks/task-2-api-access.md
  - Task 3：開啟 frontend: tasks/task-3-open-frontend.md
  - Task 4：執行 workflow: tasks/task-4-run-workflow.md
  - Task 5：檢視 dashboard: tasks/task-5-observe-dashboard.md
  - 結論: review.md
